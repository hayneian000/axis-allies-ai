<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Hot-seat Axis & Allies–style strategy game on a simplified map of the continental United States." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%94%3C/text%3E%3C/svg%3E" />
    <title>AI Axis &amp; Allies (America) — Phase 1</title>
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow+Condensed:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="setup">
      <div class="war-room-bg" aria-hidden="true"></div>
      <div class="setup-dossier">
        <div class="title-block">
          <svg class="gear-star" viewBox="0 0 100 100" aria-hidden="true">
            <g fill="none" stroke="#c9a227" stroke-width="3">
              <circle cx="50" cy="50" r="38"/>
              <circle cx="50" cy="50" r="28"/>
              <path d="M50 12 L50 22 M50 78 L50 88 M12 50 L22 50 M78 50 L88 50 M23 23 L30 30 M70 70 L77 77 M77 23 L70 30 M30 70 L23 77"/>
            </g>
            <path d="M50 32 L54 44 L67 44 L57 52 L60 65 L50 57 L40 65 L43 52 L33 44 L46 44 Z"
                  fill="#c9a227" opacity="0.9"/>
          </svg>
          <h1>Axis &amp; Allies</h1>
          <p class="subtitle">Adversarial Intelligence</p>
          <div class="eval-stamp" aria-hidden="true">Eval in<br/>Progress</div>
        </div>

        <div class="mode-row" role="group" aria-label="Game mode">
          <button type="button" class="mode-plaque active" data-mode="hotseat"
                  data-tip="Humans take turns on one screen.">
            <span class="plaque-title">Hot-Seat</span>
            <span class="plaque-desc">Humans, one screen</span>
          </button>
          <button type="button" class="mode-plaque locked" disabled
                  data-tip="Face an AI commander. Coming in Phase 2.">
            <span class="plaque-title">VS AI</span>
            <span class="phase-tag">Phase 2</span>
          </button>
          <button type="button" class="mode-plaque locked" disabled
                  data-tip="AI commanders battle for benchmarking. Coming in Phase 2.">
            <span class="plaque-title">AI vs AI</span>
            <span class="phase-tag">Phase 2</span>
          </button>
        </div>

        <div class="map-row" role="group" aria-label="Theater of war">
          <button type="button" class="map-folio active" data-map="america"
                  data-tip="26-territory continental US map. More theaters coming.">
            <span class="folio-title">American Theater</span>
            <span class="folio-desc">26 territories · FFA</span>
          </button>
          <button type="button" class="map-folio locked" disabled
                  data-tip="Future theater, not yet declassified.">
            <span class="folio-title">Classified</span>
            <span class="folio-desc">???</span>
          </button>
          <button type="button" class="map-folio locked" disabled
                  data-tip="Future theater, not yet declassified.">
            <span class="folio-title">Classified</span>
            <span class="folio-desc">???</span>
          </button>
        </div>

        <div class="setup-controls">
          <div class="commanders">
            <span class="control-label" data-tip="Number of human players sharing this screen.">Commanders</span>
            <div class="dogtags" role="group" aria-label="Number of players">
              <button type="button" class="dogtag" data-players="2">2</button>
              <button type="button" class="dogtag" data-players="3">3</button>
              <button type="button" class="dogtag active" data-players="4">4</button>
            </div>
          </div>
          <div class="op-code">
            <label class="control-label" for="seed" data-tip="Random seed. Same code = same starting setup.">Operation Code</label>
            <input id="seed" type="number" value="1" min="1" />
          </div>
        </div>

        <button id="startBtn" class="wax-seal-btn">
          <span class="seal-text">Commence<br/>Wargame</span>
        </button>

        <div class="setup-alt-actions">
          <label class="load-plaque" data-tip="Resume a saved wargame from a file.">
            Load Wargame
            <input id="setupLoadInput" type="file" accept="application/json" hidden />
          </label>
        </div>

        <p class="hint"><strong>Free-for-all.</strong> Control every capital in play to win. 20-round cap, then highest income wins.</p>
      </div>
    </div>

    <div id="game" hidden>
      <header id="topbar">
        <span id="banner"></span>
        <span id="steps"></span>
        <span class="spacer"></span>
        <button id="saveBtn" class="topbar-btn">Save</button>
        <button id="newBtn" class="topbar-btn">New game</button>
      </header>
      <div id="app">
        <div id="mapcol">
          <svg id="map" viewBox="0 0 1000 470" role="img" aria-label="Game map"></svg>
          <div id="mapctrl">
            <button id="zin" title="Zoom in">+</button>
            <button id="zout" title="Zoom out">−</button>
            <button id="zreset" title="Reset view">Reset view</button>
          </div>
          <div id="maptip" hidden></div>
          <div id="selinfo"></div>
        </div>
        <div id="side">
          <div id="roster"></div>
          <div id="phasepanel"></div>
          <div id="tabs">
            <div id="tabbtns">
              <button id="tab-log" class="tab active">Log</button>
              <button id="tab-chat" class="tab">Chat</button>
            </div>
            <div id="log"></div>
            <div id="chatwrap" hidden>
              <div id="chat"></div>
              <div id="chatrow">
                <input id="chatText" type="text" maxlength="500" placeholder="Message as current player to all" />
                <button id="chatSend">Send</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <footer id="actionbar">
        <span id="fb-phase"></span>
        <span id="error"></span>
        <span class="spacer"></span>
        <button id="endPhaseBtn" class="btn-primary btn-end-phase">End phase →</button>
      </footer>
    </div>

    <div id="modal" hidden>
      <div id="modal-box" role="dialog" aria-modal="true">
        <div id="modal-head">
          <strong id="modal-title"></strong>
          <button id="modal-close" title="Close">✕</button>
        </div>
        <div id="modal-body"></div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
